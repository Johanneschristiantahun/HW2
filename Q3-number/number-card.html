<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Number Card</title>
  <style>
    .card {
      width: 500px;
      height: 200px;
      border: 0.5em solid #698733;
      border-radius: 1em;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      box-sizing: border-box;
    }

    .card img {
      height: 70%;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="0.png" alt="0">
    <img src="1.png" alt="1">
    <img src="2.png" alt="2">
    <img src="3.png" alt="3">
  </div>

</body>
</html>
